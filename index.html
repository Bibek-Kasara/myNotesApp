<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotesApp</title>
    <style>
      body {
        height: 100vh;
        width: 100vw;
        background-color: antiquewhite;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        font-family: sans-serif;
      }
      .border {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: rgb(246, 212, 171);
        border-radius: 20px;
        padding: 20px;
        margin-top: 40px;
        min-width: 300px;
      }
      h1 {
        text-shadow: 2px 2px red;
        margin-top: 0;
      }
      .input-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      input {
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }
      button {
        padding: 8px 12px;
        border-radius: 5px;
        border: none;
        background-color: #ff6b6b;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background-color: #e05252;
      }
      ol {
        width: 100%;
        padding-left: 25px;
      }
      li {
        margin-bottom: 10px;
      }
      .delete-btn {
        margin-left: 10px;
        padding: 2px 6px;
        font-size: 12px;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div class="border">
      <h1>My Notes App</h1>
      <div class="input-container">
        <input type="text" id="noteInput" placeholder="Enter your note..." />
        <button id="addBtn">Add Note</button>
      </div>
      <ol id="noteList"></ol>
    </div>

    <script src="noteAppTask.js"></script>
  </body>
</html>
